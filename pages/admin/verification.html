<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>验证流程 - Insight</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css">
  <link rel="stylesheet" href="../../styles/admin.css">
  <style>
    .kanban-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 24px;
    }
    .kanban-step {
      flex: 1;
      text-align: center;
      padding: 16px 12px;
      background: var(--card-bg);
      border-radius: 10px;
      border: 1px solid var(--border-color);
      position: relative;
    }
    .kanban-step.active { border-color: var(--accent); background: rgba(200,149,108,0.05); }
    .kanban-step.completed { border-color: var(--success); }
    .kanban-step .step-label { font-size: 0.8125rem; color: var(--text-secondary); }
    .kanban-step .step-count {
      font-size: 1.5rem;
      font-weight: 700;
      margin: 4px 0;
    }
    .kanban-step .step-count.warn { color: var(--warning); }
    .kanban-step .step-count.ok { color: var(--success); }
    .kanban-step .step-count.busy { color: var(--primary); }
    .kanban-arrow { font-size: 1.25rem; color: var(--text-secondary); flex-shrink: 0; }
  </style>
</head>
<body>
  <div class="mobile-overlay" id="mobileOverlay" onclick="toggleMobileSidebar()"></div>

  <aside class="admin-sidebar" id="sidebar">
    <div class="sidebar-header"><div class="sidebar-logo">Insight Admin</div></div>
    <div class="sidebar-toggle" onclick="toggleSidebar()"><i class="ri-arrow-left-s-line" id="toggleIcon"></i></div>
    <nav class="sidebar-nav"></nav>
    <div class="sidebar-footer"><a href="../../index.html" class="back-to-front"><i class="ri-arrow-left-line"></i><span>返回前台</span></a></div>
  </aside>

  <header class="admin-topbar">
    <div class="topbar-left">
      <button class="btn-icon" onclick="toggleMobileSidebar()" style="display:none;" id="mobileMenuBtn"><i class="ri-menu-line"></i></button>
      <nav class="breadcrumb"><a href="index.html">首页</a> / <span class="current">验证流程</span></nav>
    </div>
    <div class="topbar-right">
      <div class="role-switcher" id="roleSwitcher"></div>
      <div class="user-menu"><div class="user-avatar" id="userAvatar"></div></div>
    </div>
  </header>

  <main class="admin-content">
    <div class="kanban-bar">
      <div class="kanban-step active"><div class="step-label">待复核</div><div class="step-count warn">12</div></div>
      <div class="kanban-arrow"><i class="ri-arrow-right-s-line"></i></div>
      <div class="kanban-step"><div class="step-label">复核中</div><div class="step-count busy">5</div></div>
      <div class="kanban-arrow"><i class="ri-arrow-right-s-line"></i></div>
      <div class="kanban-step"><div class="step-label">待终审</div><div class="step-count warn">8</div></div>
      <div class="kanban-arrow"><i class="ri-arrow-right-s-line"></i></div>
      <div class="kanban-step completed"><div class="step-label">已通过</div><div class="step-count ok">45</div></div>
    </div>

    <div id="verificationContent">
      <div class="tabs" id="verificationTabs">
        <button class="tab active" onclick="switchVerificationTab('pending', this)">待复核</button>
        <button class="tab" onclick="switchVerificationTab('appeal', this)">申诉处理</button>
      </div>

      <div class="admin-card" id="pendingView">
        <table class="data-table">
          <thead><tr><th>学员</th><th>技能名称</th><th>评估师</th><th>评估结果</th><th>提交时间</th><th>操作</th></tr></thead>
          <tbody>
            <tr><td>张伟</td><td>井控技术</td><td>李评估师</td><td><span class="badge badge-success">推荐通过</span></td><td>2026-06-10</td><td class="actions"><button class="btn btn-sm btn-primary" onclick="alert('确认通过')">确认</button><button class="btn btn-sm btn-danger" onclick="alert('打回重审')">打回</button></td></tr>
            <tr><td>王芳</td><td>HSE风险评估</td><td>李评估师</td><td><span class="badge badge-success">推荐通过</span></td><td>2026-06-09</td><td class="actions"><button class="btn btn-sm btn-primary" onclick="alert('确认通过')">确认</button><button class="btn btn-sm btn-danger" onclick="alert('打回重审')">打回</button></td></tr>
            <tr><td>李强</td><td>机械故障诊断</td><td>陈评估师</td><td><span class="badge badge-success">推荐通过</span></td><td>2026-06-08</td><td class="actions"><button class="btn btn-sm btn-primary" onclick="alert('确认通过')">确认</button><button class="btn btn-sm btn-danger" onclick="alert('打回重审')">打回</button></td></tr>
          </tbody>
        </table>
      </div>

      <div class="admin-card" id="appealView" style="display:none;">
        <table class="data-table">
          <thead><tr><th>申诉人</th><th>技能名称</th><th>申诉理由</th><th>补充证据</th><th>操作</th></tr></thead>
          <tbody>
            <tr><td>刘洋</td><td>仪表调试</td><td style="max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">评估结果与实际情况不符，我具备该项技能的所有操作经验</td><td><span class="badge badge-info">2份</span></td><td class="actions"><button class="btn btn-sm btn-secondary" onclick="alert('维持原判')">维持原判</button><button class="btn btn-sm btn-primary" onclick="alert('重新评估')">重新评估</button></td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <script src="../../app/admin-auth.js"></script>
  <script src="../../app/admin-data.js"></script>
  <script>
    if (!checkAdminAuth()) throw new Error('Not authenticated');
    renderSidebar('verification');
    renderRoleSwitcher();
    renderUserAvatar();

    function toggleSidebar() {
      var sidebar = document.getElementById('sidebar');
      var icon = document.getElementById('toggleIcon');
      sidebar.classList.toggle('collapsed');
      icon.className = sidebar.classList.contains('collapsed') ? 'ri-arrow-right-s-line' : 'ri-arrow-left-s-line';
      localStorage.setItem('sidebarCollapsed', sidebar.classList.contains('collapsed'));
    }
    if (localStorage.getItem('sidebarCollapsed') === 'true') { document.getElementById('sidebar').classList.add('collapsed'); document.getElementById('toggleIcon').className = 'ri-arrow-right-s-line'; }
    function toggleMobileSidebar() { var sidebar = document.getElementById('sidebar'); var overlay = document.getElementById('mobileOverlay'); sidebar.classList.toggle('mobile-open'); overlay.classList.toggle('active'); }
    function checkMobile() { var btn = document.getElementById('mobileMenuBtn'); btn.style.display = window.innerWidth <= 992 ? 'inline-flex' : 'none'; }
    window.addEventListener('resize', checkMobile); checkMobile();

    function switchVerificationTab(view, btn) {
      document.getElementById('pendingView').style.display = view === 'pending' ? 'block' : 'none';
      document.getElementById('appealView').style.display = view === 'appeal' ? 'block' : 'none';
      document.querySelectorAll('#verificationTabs .tab').forEach(function(t) { t.classList.remove('active'); });
      btn.classList.add('active');
    }
  </script>
</body>
</html>
