<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard - Insight</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css">
  <link rel="stylesheet" href="../../styles/admin.css">
  <style>
    .dashboard-grid {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 20px;
      margin-bottom: 20px;
    }
    .todo-list { list-style: none; }
    .todo-list li {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 0;
      border-bottom: 1px solid var(--border-color);
    }
    .todo-list li:last-child { border-bottom: none; }
    .todo-icon {
      width: 36px;
      height: 36px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1rem;
    }
    .activity-list { list-style: none; }
    .activity-list li {
      padding: 10px 0;
      border-bottom: 1px solid var(--border-color);
      font-size: 0.875rem;
    }
    .activity-list li:last-child { border-bottom: none; }
    .activity-time { color: var(--text-secondary); font-size: 0.75rem; }
    @media (max-width: 1200px) {
      .dashboard-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="mobile-overlay" id="mobileOverlay" onclick="toggleMobileSidebar()"></div>

  <script>
    // Dashboard page disabled, redirecting to User Management
    window.location.replace('users.html');
  </script>

  <aside class="admin-sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-logo"><div class="sidebar-logo-icon"><i class="ri-eye-line"></i></div><span class="sidebar-logo-text">Insight <span>Admin</span></span></div>
    </div>
    <div class="sidebar-toggle" onclick="toggleSidebar()">
      <i class="ri-arrow-left-s-line" id="toggleIcon"></i>
    </div>
    <nav class="sidebar-nav"><!-- Rendered by JS --></nav>
    <div class="sidebar-footer">
      <a href="../../index.html" class="back-to-front"><i class="ri-arrow-left-line"></i><span>Back to Front</span></a>
    </div>
  </aside>

  <header class="admin-topbar">
    <div class="topbar-left">
      <button class="btn-icon" onclick="toggleMobileSidebar()" style="display:none;" id="mobileMenuBtn"><i class="ri-menu-line"></i></button>
      <nav class="breadcrumb"><a href="index.html">Home</a> / <span class="current">Dashboard</span></nav>
    </div>
    <div class="topbar-right">
      <div class="role-switcher" id="roleSwitcher"></div>
      <div class="user-menu"><div class="user-avatar" id="userAvatar"></div></div>
    </div>
  </header>

  <main class="admin-content">
    <div class="stat-grid">
      <div class="stat-card">
        <div class="stat-icon blue"><i class="ri-user-line"></i></div>
        <div><div class="stat-value" id="statUsers">128</div><div class="stat-label">Total Employees</div><div class="stat-change up"><i class="ri-arrow-up-line"></i> +5 this month</div></div>
      </div>
      <div class="stat-card">
        <div class="stat-icon orange"><i class="ri-shield-check-line"></i></div>
        <div><div class="stat-value" id="statPending">24</div><div class="stat-label" id="statPendingLabel">Pending Evidence</div><div class="stat-change down"><i class="ri-arrow-down-line"></i> -3 vs yesterday</div></div>
      </div>
      <div class="stat-card">
        <div class="stat-icon green"><i class="ri-calendar-event-line"></i></div>
        <div><div class="stat-value" id="statWorkshops">8</div><div class="stat-label">Active Workshops</div><div class="stat-change up"><i class="ri-arrow-up-line"></i> +2 this week</div></div>
      </div>
      <div class="stat-card">
        <div class="stat-icon red"><i class="ri-award-line"></i></div>
        <div><div class="stat-value" id="statCompleted">156</div><div class="stat-label">Monthly Training</div><div class="stat-change up"><i class="ri-arrow-up-line"></i> +12 vs last month</div></div>
      </div>
    </div>

    <div class="dashboard-grid">
      <div class="admin-card accent">
        <div class="card-title">Training Completion (6 months)</div>
        <div class="chart-container"><div class="bar-chart" id="trainingChart"></div></div>
      </div>
      <div class="admin-card accent">
        <div class="card-title">Skill Pass Rate</div>
        <div style="display:flex;align-items:center;justify-content:center;height:200px;">
          <svg width="160" height="160" viewBox="0 0 160 160">
            <circle cx="80" cy="80" r="60" fill="none" stroke="#e2e8f0" stroke-width="20"/>
            <circle cx="80" cy="80" r="60" fill="none" stroke="#5b9bd5" stroke-width="20" stroke-dasharray="282.7" stroke-dashoffset="70" transform="rotate(-90 80 80)"/>
            <circle cx="80" cy="80" r="60" fill="none" stroke="#4caf7a" stroke-width="20" stroke-dasharray="282.7" stroke-dashoffset="200" transform="rotate(-90 80 80)"/>
            <text x="80" y="85" text-anchor="middle" font-size="20" font-weight="700" fill="#1e293b">78%</text>
          </svg>
        </div>
        <div style="display:flex;justify-content:center;gap:16px;margin-top:12px;font-size:0.75rem;">
          <span><span style="display:inline-block;width:8px;height:8px;background:#5b9bd5;border-radius:50%;margin-right:4px;"></span>Met Target</span>
          <span><span style="display:inline-block;width:8px;height:8px;background:#4caf7a;border-radius:50%;margin-right:4px;"></span>In Progress</span>
          <span><span style="display:inline-block;width:8px;height:8px;background:#e2e8f0;border-radius:50%;margin-right:4px;"></span>Not Started</span>
        </div>
      </div>
    </div>

    <div class="dashboard-grid">
      <div class="admin-card">
        <div class="card-title">To-do</div>
        <ul class="todo-list" id="todoList"></ul>
      </div>
      <div class="admin-card">
        <div class="card-title">Recent Activity</div>
        <ul class="activity-list" id="activityList"></ul>
      </div>
    </div>
  </main>

  <script src="../../app/admin-auth.js"></script>
  <script src="../../app/admin-data.js"></script>
  <script>
    if (!checkAdminAuth()) throw new Error('Not authenticated');

    renderSidebar('dashboard');
    renderRoleSwitcher();
    renderUserAvatar();

    function toggleSidebar() {
      var sidebar = document.getElementById('sidebar');
      var icon = document.getElementById('toggleIcon');
      sidebar.classList.toggle('collapsed');
      icon.className = sidebar.classList.contains('collapsed') ? 'ri-arrow-right-s-line' : 'ri-arrow-left-s-line';
      localStorage.setItem('sidebarCollapsed', sidebar.classList.contains('collapsed'));
    }

    if (localStorage.getItem('sidebarCollapsed') === 'true') {
      document.getElementById('sidebar').classList.add('collapsed');
      document.getElementById('toggleIcon').className = 'ri-arrow-right-s-line';
    }

    function toggleMobileSidebar() {
      var sidebar = document.getElementById('sidebar');
      var overlay = document.getElementById('mobileOverlay');
      sidebar.classList.toggle('mobile-open');
      overlay.classList.toggle('active');
    }

    function checkMobile() {
      var btn = document.getElementById('mobileMenuBtn');
      btn.style.display = window.innerWidth <= 992 ? 'inline-flex' : 'none';
    }
    window.addEventListener('resize', checkMobile);
    checkMobile();

    // Dashboard content
    function renderTrainingChart() {
      var data = [65, 72, 78, 82, 85, 88];
      var labels = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun'];
      var max = Math.max.apply(null, data);
      document.getElementById('trainingChart').innerHTML = data.map(function(val, i) {
        return '<div class="bar" style="height:' + (val/max*100) + '%"><span class="bar-label">' + labels[i] + '</span></div>';
      }).join('');
    }

    function renderTodoList() {
      var todos = [
        { icon: 'ri-task-line', color: 'orange', text: 'Zhang Wei submitted well control evidence, pending review', time: '10m ago' },
        { icon: 'ri-calendar-check-line', color: 'blue', text: '6 pending registrations for Drilling Safety Training', time: '30m ago' },
        { icon: 'ri-alarm-warning-line', color: 'red', text: '3 employees HSE certs expiring within 7 days', time: '1h ago' },
        { icon: 'ri-shield-check-line', color: 'green', text: 'Wang Fang\'s HSE Risk Assessment passed internal review', time: '2h ago' }
      ];
      document.getElementById('todoList').innerHTML = todos.map(function(t) {
        return '<li><div class="todo-icon" style="background:' + t.color + '15;color:' + t.color + ';"><i class="' + t.icon + '"></i></div><div><div style="font-size:0.875rem;">' + t.text + '</div><div style="font-size:0.75rem;color:var(--text-secondary);margin-top:2px;">' + t.time + '</div></div></li>';
      }).join('');
    }

    function renderActivityList() {
      var activities = [
        '<strong>Assessor Li</strong> completed Zhang Wei\'s well control assessment',
        '<strong>System</strong> sent 3 cert. expiry warning notifications',
        '<strong>Admin Wang</strong> created new workshop "HSE Emergency Response Drill"',
        '<strong>Verifier Zhao</strong> finalized Liu Yang\'s instrumentation certification',
        '<strong>System</strong> auto-archived May training records'
      ];
      var times = ['5m ago', '15m ago', '30m ago', '1h ago', '2h ago'];
      document.getElementById('activityList').innerHTML = activities.map(function(a, i) {
        return '<li>' + a + '<div class="activity-time">' + times[i] + '</div></li>';
      }).join('');
    }

    function adjustStatsForRole() {
      var user = getCurrentUser();
      if (!user) return;
      var label = document.getElementById('statPendingLabel');
      if (user.role === 'assessor') { document.getElementById('statPending').textContent = '12'; label.textContent = 'Pending Assessments'; }
      else if (user.role === 'internal_verifier') { document.getElementById('statPending').textContent = '8'; label.textContent = 'Pending Reviews'; }
      else if (user.role === 'standard_verifier') { document.getElementById('statPending').textContent = '5'; label.textContent = 'Pending Final Approvals'; }
    }

    renderTrainingChart();
    renderTodoList();
    renderActivityList();
    adjustStatsForRole();
  </script>
</body>
</html>
