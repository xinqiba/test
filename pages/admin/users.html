<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>用户管理 - Insight</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css">
  <link rel="stylesheet" href="../../styles/admin.css">
  <style>
    .user-avatar-cell {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-weight: 600;
      font-size: 0.875rem;
      margin-right: 10px;
      flex-shrink: 0;
    }
    .user-name-cell {
      display: inline-flex;
      align-items: center;
    }
    .progress-bar {
      width: 100%;
      height: 8px;
      background: #e2e8f0;
      border-radius: 4px;
      overflow: hidden;
    }
    .progress-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--primary), var(--accent));
      border-radius: 4px;
      transition: width 0.3s ease;
    }
    .progress-text {
      font-size: 0.75rem;
      color: var(--text-secondary);
      margin-top: 2px;
    }
    .table-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 16px;
      font-size: 0.875rem;
      color: var(--text-secondary);
    }
    .pagination {
      display: flex;
      gap: 4px;
    }
    .pagination button {
      padding: 6px 12px;
      border: 1px solid var(--border-color);
      background: #fff;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.875rem;
      color: var(--text-primary);
    }
    .pagination button:hover {
      border-color: var(--primary);
    }
    .pagination button.active {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }
    .pagination button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .empty-state {
      text-align: center;
      padding: 48px;
      color: var(--text-secondary);
    }
    .empty-state i {
      font-size: 3rem;
      margin-bottom: 12px;
      opacity: 0.5;
    }
  </style>
</head>
<body>
  <div class="mobile-overlay" id="mobileOverlay" onclick="toggleMobileSidebar()"></div>

  <aside class="admin-sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-logo">Insight Admin</div>
    </div>
    <div class="sidebar-toggle" onclick="toggleSidebar()">
      <i class="ri-arrow-left-s-line" id="toggleIcon"></i>
    </div>
    <nav class="sidebar-nav"><!-- Rendered by JS --></nav>
    <div class="sidebar-footer">
      <a href="../../index.html" class="back-to-front"><i class="ri-arrow-left-line"></i><span>返回前台</span></a>
    </div>
  </aside>

  <header class="admin-topbar">
    <div class="topbar-left">
      <button class="btn-icon" onclick="toggleMobileSidebar()" style="display:none;" id="mobileMenuBtn"><i class="ri-menu-line"></i></button>
      <nav class="breadcrumb"><a href="index.html">首页</a> / <span class="current">用户管理</span></nav>
    </div>
    <div class="topbar-right">
      <div class="role-switcher" id="roleSwitcher"></div>
      <div class="user-menu"><div class="user-avatar" id="userAvatar"></div></div>
    </div>
  </header>

  <main class="admin-content">
    <!-- Filter Bar -->
    <div class="filter-bar">
      <div class="search-box">
        <i class="ri-search-line"></i>
        <input type="text" class="filter-input" id="searchInput" placeholder="搜索姓名或工号...">
      </div>
      <select class="filter-select" id="deptFilter">
        <option value="">全部部门</option>
      </select>
      <select class="filter-select" id="roleFilter">
        <option value="">全部角色</option>
        <option value="企业管理员">企业管理员</option>
        <option value="评估师">评估师</option>
        <option value="内部验证员">内部验证员</option>
        <option value="标准验证员">标准验证员</option>
        <option value="学员">学员</option>
      </select>
      <select class="filter-select" id="certFilter">
        <option value="">全部证书状态</option>
        <option value="正常">正常</option>
        <option value="即将到期">即将到期</option>
        <option value="已过期">已过期</option>
      </select>
      <button class="btn btn-secondary btn-sm" onclick="exportUsers()">
        <i class="ri-download-line"></i> 导出
      </button>
    </div>

    <!-- Data Table -->
    <div class="admin-card">
      <div class="card-title">用户列表</div>
      <table class="data-table" id="usersTable">
        <thead>
          <tr>
            <th style="width:40px;"><input type="checkbox" id="selectAll"></th>
            <th>姓名</th>
            <th>工号</th>
            <th>部门</th>
            <th>角色</th>
            <th>技能数</th>
            <th>培训进度</th>
            <th>证书状态</th>
            <th style="width:120px;">操作</th>
          </tr>
        </thead>
        <tbody id="usersTableBody">
          <!-- Rendered by JS -->
        </tbody>
      </table>
      <div id="emptyState" class="empty-state" style="display:none;">
        <i class="ri-user-search-line"></i>
        <div>未找到匹配的用户</div>
      </div>
      <div class="table-footer" id="tableFooter">
        <span id="tableInfo">共 0 条记录</span>
        <div class="pagination" id="pagination"></div>
      </div>
    </div>
  </main>

  <script src="../../app/admin-auth.js"></script>
  <script src="../../app/admin-data.js"></script>
  <script>
    if (!checkAdminAuth()) throw new Error('Not authenticated');

    renderSidebar('users');
    renderRoleSwitcher();
    renderUserAvatar();

    function toggleSidebar() {
      var sidebar = document.getElementById('sidebar');
      var icon = document.getElementById('toggleIcon');
      sidebar.classList.toggle('collapsed');
      icon.className = sidebar.classList.contains('collapsed') ? 'ri-arrow-right-s-line' : 'ri-arrow-left-s-line';
      localStorage.setItem('sidebarCollapsed', sidebar.classList.contains('collapsed'));
    }

    if (localStorage.getItem('sidebarCollapsed') === 'true') {
      document.getElementById('sidebar').classList.add('collapsed');
      document.getElementById('toggleIcon').className = 'ri-arrow-right-s-line';
    }

    function toggleMobileSidebar() {
      var sidebar = document.getElementById('sidebar');
      var overlay = document.getElementById('mobileOverlay');
      sidebar.classList.toggle('mobile-open');
      overlay.classList.toggle('active');
    }

    function checkMobile() {
      var btn = document.getElementById('mobileMenuBtn');
      btn.style.display = window.innerWidth <= 992 ? 'inline-flex' : 'none';
    }
    window.addEventListener('resize', checkMobile);
    checkMobile();

    // User management logic
    var allUsers = generateUsers(50);
    var filteredUsers = allUsers.slice();
    var currentPage = 1;
    var pageSize = 10;

    function populateDeptFilter() {
      var select = document.getElementById('deptFilter');
      var depts = [...new Set(allUsers.map(function(u) { return u.department; }))];
      depts.forEach(function(dept) {
        var opt = document.createElement('option');
        opt.value = dept;
        opt.textContent = dept;
        select.appendChild(opt);
      });
    }

    function getCertBadgeClass(status) {
      if (status === '正常') return 'badge-success';
      if (status === '即将到期') return 'badge-warning';
      if (status === '已过期') return 'badge-danger';
      return 'badge-info';
    }

    function renderTable() {
      var tbody = document.getElementById('usersTableBody');
      var empty = document.getElementById('emptyState');
      var start = (currentPage - 1) * pageSize;
      var end = start + pageSize;
      var pageData = filteredUsers.slice(start, end);

      if (filteredUsers.length === 0) {
        tbody.innerHTML = '';
        empty.style.display = 'block';
        document.getElementById('tableInfo').textContent = '共 0 条记录';
        document.getElementById('pagination').innerHTML = '';
        return;
      }

      empty.style.display = 'none';
      tbody.innerHTML = pageData.map(function(u) {
        var avatarChar = u.name.charAt(0);
        var certClass = getCertBadgeClass(u.certStatus);
        return '<tr>' +
          '<td><input type="checkbox" class="row-checkbox" data-id="' + u.id + '"></td>' +
          '<td><div class="user-name-cell"><div class="user-avatar-cell">' + avatarChar + '</div>' + u.name + '</div></td>' +
          '<td>' + u.employeeId + '</td>' +
          '<td>' + u.department + '</td>' +
          '<td>' + u.role + '</td>' +
          '<td>' + u.skillsCount + '</td>' +
          '<td>' +
            '<div class="progress-bar"><div class="progress-bar-fill" style="width:' + u.trainingProgress + '%;"></div></div>' +
            '<div class="progress-text">' + u.trainingProgress + '%</div>' +
          '</td>' +
          '<td><span class="badge ' + certClass + '">' + u.certStatus + '</span></td>' +
          '<td class="actions">' +
            '<button class="btn-icon" title="查看" onclick="viewUser(' + u.id + ')"><i class="ri-eye-line"></i></button>' +
            '<button class="btn-icon" title="编辑" onclick="editUser(' + u.id + ')"><i class="ri-edit-line"></i></button>' +
          '</td>' +
        '</tr>';
      }).join('');

      document.getElementById('tableInfo').textContent = '共 ' + filteredUsers.length + ' 条记录，第 ' + currentPage + ' / ' + Math.ceil(filteredUsers.length / pageSize) + ' 页';
      renderPagination();
    }

    function renderPagination() {
      var totalPages = Math.ceil(filteredUsers.length / pageSize);
      var html = '';
      html += '<button ' + (currentPage === 1 ? 'disabled' : '') + ' onclick="goToPage(' + (currentPage - 1) + ')"><i class="ri-arrow-left-s-line"></i></button>';
      for (var i = 1; i <= totalPages; i++) {
        if (i === 1 || i === totalPages || (i >= currentPage - 1 && i <= currentPage + 1)) {
          html += '<button class="' + (i === currentPage ? 'active' : '') + '" onclick="goToPage(' + i + ')">' + i + '</button>';
        } else if (i === currentPage - 2 || i === currentPage + 2) {
          html += '<span style="padding:6px 8px;color:var(--text-secondary);">...</span>';
        }
      }
      html += '<button ' + (currentPage === totalPages ? 'disabled' : '') + ' onclick="goToPage(' + (currentPage + 1) + ')"><i class="ri-arrow-right-s-line"></i></button>';
      document.getElementById('pagination').innerHTML = html;
    }

    function goToPage(page) {
      var totalPages = Math.ceil(filteredUsers.length / pageSize);
      if (page < 1 || page > totalPages) return;
      currentPage = page;
      renderTable();
    }

    function applyFilters() {
      var search = document.getElementById('searchInput').value.trim().toLowerCase();
      var dept = document.getElementById('deptFilter').value;
      var role = document.getElementById('roleFilter').value;
      var cert = document.getElementById('certFilter').value;

      filteredUsers = allUsers.filter(function(u) {
        var matchSearch = !search || u.name.toLowerCase().indexOf(search) !== -1 || u.employeeId.toLowerCase().indexOf(search) !== -1;
        var matchDept = !dept || u.department === dept;
        var matchRole = !role || u.role === role;
        var matchCert = !cert || u.certStatus === cert;
        return matchSearch && matchDept && matchRole && matchCert;
      });

      currentPage = 1;
      renderTable();
    }

    document.getElementById('searchInput').addEventListener('input', applyFilters);
    document.getElementById('deptFilter').addEventListener('change', applyFilters);
    document.getElementById('roleFilter').addEventListener('change', applyFilters);
    document.getElementById('certFilter').addEventListener('change', applyFilters);

    document.getElementById('selectAll').addEventListener('change', function(e) {
      var checked = e.target.checked;
      document.querySelectorAll('.row-checkbox').forEach(function(cb) {
        cb.checked = checked;
      });
    });

    function viewUser(id) {
      var user = allUsers.find(function(u) { return u.id === id; });
      if (user) alert('查看用户：' + user.name + ' (' + user.employeeId + ')');
    }

    function editUser(id) {
      var user = allUsers.find(function(u) { return u.id === id; });
      if (user) alert('编辑用户：' + user.name + ' (' + user.employeeId + ')');
    }

    function exportUsers() {
      alert('导出 ' + filteredUsers.length + ' 条用户记录');
    }

    populateDeptFilter();
    renderTable();
  </script>
</body>
</html>
