<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Management - Insight</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css">
  <link rel="stylesheet" href="../../styles/admin.css">
  <style>
    .user-avatar-cell {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-weight: 600;
      font-size: 0.875rem;
      margin-right: 10px;
      flex-shrink: 0;
    }
    .user-name-cell {
      display: inline-flex;
      align-items: center;
    }
    .progress-bar {
      width: 100%;
      height: 8px;
      background: #e2e8f0;
      border-radius: 4px;
      overflow: hidden;
    }
    .progress-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--primary), var(--accent));
      border-radius: 4px;
      transition: width 0.3s ease;
    }
    .progress-text {
      font-size: 0.75rem;
      color: var(--text-secondary);
      margin-top: 2px;
    }
    .table-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 16px;
      font-size: 0.875rem;
      color: var(--text-secondary);
    }
    .pagination {
      display: flex;
      gap: 4px;
    }
    .pagination button {
      padding: 6px 12px;
      border: 1px solid var(--border-color);
      background: #fff;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.875rem;
      color: var(--text-primary);
    }
    .pagination button:hover {
      border-color: var(--primary);
    }
    .pagination button.active {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }
    .pagination button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .empty-state {
      text-align: center;
      padding: 48px;
      color: var(--text-secondary);
    }
    .empty-state i {
      font-size: 3rem;
      margin-bottom: 12px;
      opacity: 0.5;
    }
    /* ---- Modal Form Fields ---- */
    .form-group { margin-bottom: 14px; }
    .form-group label { display: block; font-size: 0.8125rem; font-weight: 500; color: var(--text-primary); margin-bottom: 4px; }
    .form-control { width: 100%; padding: 8px 12px; border: 1px solid var(--border-color); border-radius: 6px; font-size: 0.875rem; font-family: inherit; color: var(--text-primary); }
    .form-control:focus { outline: none; border-color: var(--accent); }
    .form-row { display: flex; gap: 12px; }
    .form-row .form-group { flex: 1; }
  </style>
</head>
<body>
  <div class="mobile-overlay" id="mobileOverlay" onclick="toggleMobileSidebar()"></div>

  <aside class="admin-sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-logo"><div class="sidebar-logo-icon"><i class="ri-eye-line"></i></div><span class="sidebar-logo-text">Insight <span>Admin</span></span></div>
    </div>
    <div class="sidebar-toggle" onclick="toggleSidebar()">
      <i class="ri-arrow-left-s-line" id="toggleIcon"></i>
    </div>
    <nav class="sidebar-nav"><!-- Rendered by JS --></nav>
    <div class="sidebar-footer">
      <a href="../../index.html" class="back-to-front"><i class="ri-arrow-left-line"></i><span>Back to Front</span></a>
    </div>
  </aside>

  <header class="admin-topbar">
    <div class="topbar-left">
      <button class="btn-icon" onclick="toggleMobileSidebar()" style="display:none;" id="mobileMenuBtn"><i class="ri-menu-line"></i></button>
      <nav class="breadcrumb"><a href="index.html">Home</a> / <span class="current">User Management</span></nav>
    </div>
    <div class="topbar-right">
      <div class="role-switcher" id="roleSwitcher"></div>
      <div class="user-menu"><div class="user-avatar" id="userAvatar"></div></div>
    </div>
  </header>

  <main class="admin-content">
    <!-- Filter Bar -->
    <div class="filter-bar">
      <div class="search-box">
        <i class="ri-search-line"></i>
        <input type="text" class="filter-input" id="searchInput" placeholder="Search name or ID...">
      </div>
      <select class="filter-select" id="deptFilter">
        <option value="">All Departments</option>
      </select>
      <select class="filter-select" id="roleFilter">
        <option value="">All Roles</option>
        <option value="Enterprise Admin">Enterprise Admin</option>
        <option value="Assessor">Assessor</option>
        <option value="Internal Verifier">Internal Verifier</option>
        <option value="Standard Verifier">Standard Verifier</option>
        <option value="Student">Student</option>
      </select>
      <select class="filter-select" id="certFilter">
        <option value="">All Cert. Status</option>
        <option value="Active">Active</option>
        <option value="Expiring Soon">Expiring Soon</option>
        <option value="Expired">Expired</option>
      </select>
      <button class="btn btn-secondary btn-sm" onclick="exportUsers()">
        <i class="ri-download-line"></i> Export
      </button>
      <button class="btn btn-primary btn-sm" onclick="openUserModal()">
        <i class="ri-add-line"></i> New User
      </button>
    </div>

    <!-- Data Table -->
    <div class="admin-card">
      <div class="card-title">User List</div>
      <table class="data-table" id="usersTable">
        <thead>
          <tr>
            <th style="width:40px;"><input type="checkbox" id="selectAll"></th>
            <th>Name</th>
            <th>Employee ID</th>
            <th>Department</th>
            <th>Role</th>
            <th>Skills</th>
            <th>Training Progress</th>
            <th>Cert. Status</th>
            <th style="width:120px;">Actions</th>
          </tr>
        </thead>
        <tbody id="usersTableBody">
          <!-- Rendered by JS -->
        </tbody>
      </table>
      <div id="emptyState" class="empty-state" style="display:none;">
        <i class="ri-user-search-line"></i>
        <div>No matching users found</div>
      </div>
      <div class="table-footer" id="tableFooter">
        <span id="tableInfo">Total 0 records</span>
        <div class="pagination" id="pagination"></div>
      </div>
    </div>
  </main>

  <!-- User Create/Edit Modal -->
  <div class="modal-overlay" id="userModal">
    <div class="modal" style="max-width:520px;">
      <div class="modal-header">
        <div class="modal-title" id="userModalTitle">New User</div>
        <button class="modal-close" onclick="closeUserModal()"><i class="ri-close-line"></i></button>
      </div>
      <div class="modal-body">
        <div class="form-group"><label>Name</label><input type="text" class="form-control" id="uName"></div>
        <div class="form-group"><label>Employee ID</label><input type="text" class="form-control" id="uEmpId"></div>
        <div class="form-row">
          <div class="form-group"><label>Department</label><select class="form-control" id="uDept"></select></div>
          <div class="form-group"><label>Role</label><select class="form-control" id="uRole">
            <option value="Enterprise Admin">Enterprise Admin</option>
            <option value="Assessor">Assessor</option>
            <option value="Internal Verifier">Internal Verifier</option>
            <option value="Standard Verifier">Standard Verifier</option>
            <option value="Student">Student</option>
            <option value="System Admin">System Admin</option>
          </select></div>
        </div>
        <div class="form-row">
          <div class="form-group"><label>Skills Count</label><input type="number" class="form-control" id="uSkills"></div>
          <div class="form-group"><label>Training Progress (%)</label><input type="number" class="form-control" id="uProgress" min="0" max="100"></div>
        </div>
        <div class="form-group"><label>Cert. Status</label><select class="form-control" id="uCert">
          <option value="Active">Active</option>
          <option value="Expiring Soon">Expiring Soon</option>
          <option value="Expired">Expired</option>
        </select></div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" onclick="closeUserModal()">Cancel</button>
        <button class="btn btn-primary" onclick="saveUser()">Save</button>
      </div>
    </div>
  </div>

  <script src="../../app/admin-auth.js"></script>
  <script src="../../app/admin-data.js"></script>
  <script>
    if (!checkAdminAuth()) throw new Error('Not authenticated');

    renderSidebar('users');
    renderRoleSwitcher();
    renderUserAvatar();

    function toggleSidebar() {
      var sidebar = document.getElementById('sidebar');
      var icon = document.getElementById('toggleIcon');
      sidebar.classList.toggle('collapsed');
      icon.className = sidebar.classList.contains('collapsed') ? 'ri-arrow-right-s-line' : 'ri-arrow-left-s-line';
      localStorage.setItem('sidebarCollapsed', sidebar.classList.contains('collapsed'));
    }

    if (localStorage.getItem('sidebarCollapsed') === 'true') {
      document.getElementById('sidebar').classList.add('collapsed');
      document.getElementById('toggleIcon').className = 'ri-arrow-right-s-line';
    }

    function toggleMobileSidebar() {
      var sidebar = document.getElementById('sidebar');
      var overlay = document.getElementById('mobileOverlay');
      sidebar.classList.toggle('mobile-open');
      overlay.classList.toggle('active');
    }

    function checkMobile() {
      var btn = document.getElementById('mobileMenuBtn');
      btn.style.display = window.innerWidth <= 992 ? 'inline-flex' : 'none';
    }
    window.addEventListener('resize', checkMobile);
    checkMobile();

    // User management logic
    var allUsers = generateUsers(50);
    var filteredUsers = allUsers.slice();
    var currentPage = 1;
    var pageSize = 10;

    function populateDeptFilter() {
      var select = document.getElementById('deptFilter');
      var depts = [...new Set(allUsers.map(function(u) { return u.department; }))];
      depts.forEach(function(dept) {
        var opt = document.createElement('option');
        opt.value = dept;
        opt.textContent = dept;
        select.appendChild(opt);
      });
    }

    function getCertBadgeClass(status) {
      if (status === 'Active') return 'badge-success';
      if (status === 'Expiring Soon') return 'badge-warning';
      if (status === 'Expired') return 'badge-danger';
      return 'badge-info';
    }

    function renderTable() {
      var tbody = document.getElementById('usersTableBody');
      var empty = document.getElementById('emptyState');
      var start = (currentPage - 1) * pageSize;
      var end = start + pageSize;
      var pageData = filteredUsers.slice(start, end);

      if (filteredUsers.length === 0) {
        tbody.innerHTML = '';
        empty.style.display = 'block';
        document.getElementById('tableInfo').textContent = 'Total 0 records';
        document.getElementById('pagination').innerHTML = '';
        return;
      }

      empty.style.display = 'none';
      tbody.innerHTML = pageData.map(function(u) {
        var avatarChar = u.name.charAt(0);
        var certClass = getCertBadgeClass(u.certStatus);
        return '<tr>' +
          '<td><input type="checkbox" class="row-checkbox" data-id="' + u.id + '"></td>' +
          '<td><div class="user-name-cell"><div class="user-avatar-cell">' + avatarChar + '</div>' + u.name + '</div></td>' +
          '<td>' + u.employeeId + '</td>' +
          '<td>' + u.department + '</td>' +
          '<td>' + u.role + '</td>' +
          '<td>' + u.skillsCount + '</td>' +
          '<td>' +
            '<div class="progress-bar"><div class="progress-bar-fill" style="width:' + u.trainingProgress + '%;"></div></div>' +
            '<div class="progress-text">' + u.trainingProgress + '%</div>' +
          '</td>' +
          '<td><span class="badge ' + certClass + '">' + u.certStatus + '</span></td>' +
          '<td class="actions">' +
            '<button class="btn-icon" title="View" onclick="viewUser(' + u.id + ')"><i class="ri-eye-line"></i></button>' +
            '<button class="btn-icon" title="Edit" onclick="editUser(' + u.id + ')"><i class="ri-edit-line"></i></button>' +
          '</td>' +
        '</tr>';
      }).join('');

      document.getElementById('tableInfo').textContent = 'Total ' + filteredUsers.length + ' records, Page ' + currentPage + ' / ' + Math.ceil(filteredUsers.length / pageSize);
      renderPagination();
    }

    function renderPagination() {
      var totalPages = Math.ceil(filteredUsers.length / pageSize);
      var html = '';
      html += '<button ' + (currentPage === 1 ? 'disabled' : '') + ' onclick="goToPage(' + (currentPage - 1) + ')"><i class="ri-arrow-left-s-line"></i></button>';
      for (var i = 1; i <= totalPages; i++) {
        if (i === 1 || i === totalPages || (i >= currentPage - 1 && i <= currentPage + 1)) {
          html += '<button class="' + (i === currentPage ? 'active' : '') + '" onclick="goToPage(' + i + ')">' + i + '</button>';
        } else if (i === currentPage - 2 || i === currentPage + 2) {
          html += '<span style="padding:6px 8px;color:var(--text-secondary);">...</span>';
        }
      }
      html += '<button ' + (currentPage === totalPages ? 'disabled' : '') + ' onclick="goToPage(' + (currentPage + 1) + ')"><i class="ri-arrow-right-s-line"></i></button>';
      document.getElementById('pagination').innerHTML = html;
    }

    function goToPage(page) {
      var totalPages = Math.ceil(filteredUsers.length / pageSize);
      if (page < 1 || page > totalPages) return;
      currentPage = page;
      renderTable();
    }

    function applyFilters() {
      var search = document.getElementById('searchInput').value.trim().toLowerCase();
      var dept = document.getElementById('deptFilter').value;
      var role = document.getElementById('roleFilter').value;
      var cert = document.getElementById('certFilter').value;

      filteredUsers = allUsers.filter(function(u) {
        var matchSearch = !search || u.name.toLowerCase().indexOf(search) !== -1 || u.employeeId.toLowerCase().indexOf(search) !== -1;
        var matchDept = !dept || u.department === dept;
        var matchRole = !role || u.role === role;
        var matchCert = !cert || u.certStatus === cert;
        return matchSearch && matchDept && matchRole && matchCert;
      });

      currentPage = 1;
      renderTable();
    }

    document.getElementById('searchInput').addEventListener('input', applyFilters);
    document.getElementById('deptFilter').addEventListener('change', applyFilters);
    document.getElementById('roleFilter').addEventListener('change', applyFilters);
    document.getElementById('certFilter').addEventListener('change', applyFilters);

    document.getElementById('selectAll').addEventListener('change', function(e) {
      var checked = e.target.checked;
      document.querySelectorAll('.row-checkbox').forEach(function(cb) {
        cb.checked = checked;
      });
    });

    var editingUserId = null;

    function openUserModal(id) {
      editingUserId = id || null;
      var modal = document.getElementById('userModal');
      var title = document.getElementById('userModalTitle');
      // Re-enable inputs and show save button
      var inputs = document.querySelectorAll('#userModal .form-control');
      inputs.forEach(function(inp) { inp.disabled = false; });
      var saveBtn = document.getElementById('userModal').querySelector('.btn-primary');
      if (saveBtn) saveBtn.style.display = '';
      // populate department dropdown
      var deptSelect = document.getElementById('uDept');
      deptSelect.innerHTML = MOCK_DEPARTMENTS.map(function(d) { return '<option value="' + d + '">' + d + '</option>'; }).join('');

      if (id) {
        var user = allUsers.find(function(u) { return u.id === id; });
        if (!user) return;
        title.textContent = 'Edit User';
        document.getElementById('uName').value = user.name;
        document.getElementById('uEmpId').value = user.employeeId;
        document.getElementById('uDept').value = user.department;
        document.getElementById('uRole').value = user.role;
        document.getElementById('uSkills').value = user.skillsCount;
        document.getElementById('uProgress').value = user.trainingProgress;
        document.getElementById('uCert').value = user.certStatus;
      } else {
        title.textContent = 'New User';
        document.getElementById('uName').value = '';
        document.getElementById('uEmpId').value = 'EMP' + String(allUsers.length + 1).padStart(4, '0');
        document.getElementById('uDept').value = MOCK_DEPARTMENTS[0];
        document.getElementById('uRole').value = 'Student';
        document.getElementById('uSkills').value = '1';
        document.getElementById('uProgress').value = '0';
        document.getElementById('uCert').value = 'Active';
      }
      modal.classList.add('active');
    }

    function closeUserModal() {
      document.getElementById('userModal').classList.remove('active');
      editingUserId = null;
    }

    function saveUser() {
      var userData = {
        name: document.getElementById('uName').value.trim(),
        employeeId: document.getElementById('uEmpId').value.trim(),
        department: document.getElementById('uDept').value,
        role: document.getElementById('uRole').value,
        skillsCount: parseInt(document.getElementById('uSkills').value) || 1,
        trainingProgress: parseInt(document.getElementById('uProgress').value) || 0,
        certStatus: document.getElementById('uCert').value
      };
      if (!userData.name || !userData.employeeId) { alert('Please fill in Name and Employee ID.'); return; }

      if (editingUserId) {
        var idx = allUsers.findIndex(function(u) { return u.id === editingUserId; });
        if (idx !== -1) {
          userData.id = editingUserId;
          allUsers[idx] = userData;
        }
      } else {
        userData.id = allUsers.length ? Math.max.apply(null, allUsers.map(function(u) { return u.id; })) + 1 : 1;
        allUsers.unshift(userData);
      }
      closeUserModal();
      applyFilters();
    }

    function viewUser(id) {
      openUserModal(id);
      // Disable all inputs for view-only mode
      setTimeout(function() {
        var inputs = document.querySelectorAll('#userModal .form-control');
        inputs.forEach(function(inp) { inp.disabled = true; });
        var saveBtn = document.getElementById('userModal').querySelector('.btn-primary');
        if (saveBtn) saveBtn.style.display = 'none';
      }, 0);
    }

    function editUser(id) {
      openUserModal(id);
    }

    function exportUsers() {
      alert('Export ' + filteredUsers.length + ' user records');
    }

    populateDeptFilter();
    renderTable();
  </script>
</body>
</html>
