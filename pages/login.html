<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Insight</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            height: 100vh;
            overflow: hidden;
        }

        .container {
            display: flex;
            height: 100vh;
            width: 100vw;
        }

        /* Left brand section */
        .brand-section {
            width: 50%;
            background: linear-gradient(135deg, #0f1f3a 0%, #1e3a5f 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
        }

        /* Grid line background */
        .brand-section::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image:
                linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 50px 50px;
            pointer-events: none;
        }

        /* Golden particle animation */
        .particles {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            pointer-events: none;
            overflow: hidden;
        }

        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: rgba(212, 175, 55, 0.6);
            border-radius: 50%;
            animation: float 8s infinite ease-in-out;
        }

        .particle:nth-child(1) { left: 10%; top: 20%; animation-delay: 0s; }
        .particle:nth-child(2) { left: 20%; top: 60%; animation-delay: 1s; width: 6px; height: 6px; }
        .particle:nth-child(3) { left: 35%; top: 30%; animation-delay: 2s; }
        .particle:nth-child(4) { left: 50%; top: 70%; animation-delay: 3s; width: 5px; height: 5px; }
        .particle:nth-child(5) { left: 65%; top: 15%; animation-delay: 4s; }
        .particle:nth-child(6) { left: 75%; top: 50%; animation-delay: 5s; width: 3px; height: 3px; }
        .particle:nth-child(7) { left: 85%; top: 80%; animation-delay: 6s; }
        .particle:nth-child(8) { left: 45%; top: 40%; animation-delay: 7s; width: 5px; height: 5px; }

        @keyframes float {
            0%, 100% {
                transform: translateY(0) translateX(0);
                opacity: 0.3;
            }
            25% {
                transform: translateY(-30px) translateX(10px);
                opacity: 0.8;
            }
            50% {
                transform: translateY(-15px) translateX(-10px);
                opacity: 0.5;
            }
            75% {
                transform: translateY(-40px) translateX(5px);
                opacity: 0.7;
            }
        }

        .brand-content {
            text-align: center;
            z-index: 1;
        }

        .logo {
            font-size: 56px;
            font-weight: 700;
            color: #d4af37;
            margin-bottom: 20px;
            letter-spacing: 8px;
        }

        .slogan {
            font-size: 18px;
            color: rgba(255, 255, 255, 0.8);
            letter-spacing: 2px;
            line-height: 1.6;
        }

        .copyright {
            position: absolute;
            bottom: 30px;
            font-size: 13px;
            color: rgba(255, 255, 255, 0.4);
            z-index: 1;
        }

        /* Right login form section */
        .form-section {
            width: 50%;
            background: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px 80px;
        }

        .form-container {
            width: 100%;
            max-width: 400px;
        }

        .form-header {
            margin-bottom: 40px;
        }

        .form-header h1 {
            font-size: 32px;
            font-weight: 600;
            color: #1a1a1a;
            margin-bottom: 8px;
        }

        .form-header p {
            font-size: 15px;
            color: #888888;
        }

        .form-group {
            margin-bottom: 24px;
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper input {
            width: 100%;
            height: 48px;
            padding: 0 16px 0 44px;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            font-size: 15px;
            color: #333333;
            background: #fafafa;
            transition: all 0.3s ease;
            outline: none;
        }

        .input-wrapper input:focus {
            border-color: #d4af37;
            background: #ffffff;
            box-shadow: 0 0 0 3px rgba(212, 175, 55, 0.1);
        }

        .input-wrapper input::placeholder {
            color: #aaaaaa;
        }

        .input-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            width: 20px;
            height: 20px;
            color: #999999;
            pointer-events: none;
            transition: color 0.3s ease;
        }

        .input-wrapper input:focus + .input-icon {
            color: #d4af37;
        }

        .input-wrapper input:focus ~ .input-icon {
            color: #d4af37;
        }

        .toggle-password {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            width: 20px;
            height: 20px;
            color: #999999;
            transition: color 0.3s ease;
        }

        .toggle-password:hover {
            color: #d4af37;
        }

        /* Captcha */
        .captcha-wrapper {
            display: flex;
            gap: 12px;
        }

        .captcha-wrapper .input-wrapper {
            flex: 1;
        }

        .captcha-image {
            width: 100px;
            height: 48px;
            background: linear-gradient(135deg, #f5f5f5 0%, #e8e8e8 100%);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: 600;
            color: #d4af37;
            letter-spacing: 4px;
            cursor: pointer;
            border: 1px solid #e0e0e0;
            user-select: none;
        }

        /* Remember me and forgot password */
        .form-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 28px;
        }

        .remember-me {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }

        .remember-me input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: #d4af37;
            cursor: pointer;
        }

        .remember-me span {
            font-size: 14px;
            color: #666666;
        }

        .forgot-password {
            font-size: 14px;
            color: #d4af37;
            text-decoration: none;
            transition: opacity 0.3s ease;
        }

        .forgot-password:hover {
            opacity: 0.8;
            text-decoration: underline;
        }

        /* Login button */
        .btn-login {
            width: 100%;
            height: 48px;
            background: linear-gradient(135deg, #d4af37 0%, #c9a227 100%);
            color: #ffffff;
            font-size: 16px;
            font-weight: 600;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            letter-spacing: 2px;
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(212, 175, 55, 0.3);
        }

        .btn-login:active {
            transform: translateY(0);
        }

        /* Bottom register link */
        .form-footer {
            text-align: center;
            margin-top: 32px;
            font-size: 14px;
            color: #888888;
        }

        .form-footer a {
            color: #d4af37;
            text-decoration: none;
            font-weight: 500;
            transition: opacity 0.3s ease;
        }

        .form-footer a:hover {
            opacity: 0.8;
            text-decoration: underline;
        }

        /* Responsive */
        @media (max-width: 900px) {
            .brand-section {
                display: none;
            }
            .form-section {
                width: 100%;
                padding: 40px 30px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Left brand section -->
        <div class="brand-section">
            <div class="particles">
                <div class="particle"></div>
                <div class="particle"></div>
                <div class="particle"></div>
                <div class="particle"></div>
                <div class="particle"></div>
                <div class="particle"></div>
                <div class="particle"></div>
                <div class="particle"></div>
            </div>
            <div class="brand-content">
                <div class="logo">Insight</div>
                <p class="slogan">Empowering Oil & Gas Talent, Building Professional Certification</p>
            </div>
            <div class="copyright">© 2024 Insight Platform. All Rights Reserved.</div>
        </div>

        <!-- Right login form section -->
        <div class="form-section">
            <div class="form-container">
                <div class="form-header">
                    <h1>Welcome Back</h1>
                    <p>Please sign in to your account</p>
                </div>

                <form id="loginForm">
                    <!-- Username -->
                    <div class="form-group">
                        <div class="input-wrapper">
                            <input type="text" id="username" placeholder="Username" required>
                            <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                                <circle cx="12" cy="7" r="4"></circle>
                            </svg>
                        </div>
                    </div>

                    <!-- Password -->
                    <div class="form-group">
                        <div class="input-wrapper">
                            <input type="password" id="password" placeholder="Password" required>
                            <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                            </svg>
                            <svg class="toggle-password" id="togglePassword" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                <circle cx="12" cy="12" r="3"></circle>
                            </svg>
                        </div>
                    </div>

                    <!-- Verification Code -->
                    <div class="form-group">
                        <div class="captcha-wrapper">
                            <div class="input-wrapper">
                                <input type="text" id="captcha" placeholder="Verification Code" maxlength="4" required>
                                <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <polyline points="9 11 12 14 22 4"></polyline>
                                    <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"></path>
                                </svg>
                            </div>
                            <div class="captcha-image" onclick="refreshCaptcha()">AB12</div>
                        </div>
                    </div>

                    <!-- Remember me and forgot password -->
                    <div class="form-options">
                        <label class="remember-me">
                            <input type="checkbox" id="remember">
                            <span>Remember me</span>
                        </label>
                        <a href="#" class="forgot-password">Forgot password?</a>
                    </div>

                    <!-- LoginButtons -->
                    <button type="submit" class="btn-login">Sign In</button>
                </form>

                <!-- Quick Login Demo Buttons -->
                <div style="margin-top:24px;padding-top:20px;border-top:1px solid #e2e8f0;">
                    <p style="font-size:0.75rem;color:#888;text-align:center;margin-bottom:12px;">演示账号快捷登录</p>
                    <div style="display:flex;flex-wrap:wrap;gap:8px;justify-content:center;">
                        <button type="button" class="quick-login-btn" data-user="admin" style="padding:6px 12px;border:1px solid #e0e0e0;border-radius:4px;background:#fff;font-size:0.75rem;cursor:pointer;color:#666;transition:all 0.2s;">系统管理员</button>
                        <button type="button" class="quick-login-btn" data-user="manager" style="padding:6px 12px;border:1px solid #e0e0e0;border-radius:4px;background:#fff;font-size:0.75rem;cursor:pointer;color:#666;transition:all 0.2s;">企业管理员</button>
                        <button type="button" class="quick-login-btn" data-user="assessor" style="padding:6px 12px;border:1px solid #e0e0e0;border-radius:4px;background:#fff;font-size:0.75rem;cursor:pointer;color:#666;transition:all 0.2s;">评估师</button>
                        <button type="button" class="quick-login-btn" data-user="verifier" style="padding:6px 12px;border:1px solid #e0e0e0;border-radius:4px;background:#fff;font-size:0.75rem;cursor:pointer;color:#666;transition:all 0.2s;">验证员</button>
                        <button type="button" class="quick-login-btn" data-user="user" style="padding:6px 12px;border:1px solid #e0e0e0;border-radius:4px;background:#fff;font-size:0.75rem;cursor:pointer;color:#666;transition:all 0.2s;">普通学员</button>
                    </div>
                </div>

                <div class="form-footer">
                    Don't have an account? <a href="register.html">Enterprise Registration</a>
                </div>
            </div>
        </div>
    </div>

    <script src="../app/admin-auth.js"></script>
    <script>
        // Auto-redirect if already logged in
        (function() {
            var user = getCurrentUser();
            if (user) {
                if (isAdmin(user.role)) {
                    window.location.href = 'admin/index.html';
                } else {
                    window.location.href = '../index.html';
                }
                return;
            }
        })();

        // Password show/hide toggle
        document.getElementById('togglePassword').addEventListener('click', function() {
            const passwordInput = document.getElementById('password');
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                this.innerHTML = '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line>';
            } else {
                passwordInput.type = 'password';
                this.innerHTML = '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle>';
            }
        });

        // Refresh captcha
        function refreshCaptcha() {
            const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
            let code = '';
            for (let i = 0; i < 4; i++) {
                code += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            document.querySelector('.captcha-image').textContent = code;
        }

        // Form submit with auth
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            var username = document.getElementById('username').value.trim();
            var password = document.getElementById('password').value;
            var errorEl = document.getElementById('loginError');

            if (!errorEl) {
                errorEl = document.createElement('div');
                errorEl.id = 'loginError';
                errorEl.style.cssText = 'color:#e05d5d;font-size:0.875rem;margin-top:12px;text-align:center;display:none;';
                document.getElementById('loginForm').appendChild(errorEl);
            }

            var user = login(username, password);
            if (user) {
                var params = new URLSearchParams(location.search);
                var redirect = params.get('redirect');
                if (redirect) {
                    window.location.href = decodeURIComponent(redirect);
                } else if (isAdmin(user.role)) {
                    window.location.href = 'admin/index.html';
                } else {
                    window.location.href = '../index.html';
                }
            } else {
                errorEl.textContent = '账号或密码错误';
                errorEl.style.display = 'block';
            }
        });

        // Quick login buttons
        document.querySelectorAll('.quick-login-btn').forEach(function(btn) {
            btn.addEventListener('click', function() {
                var username = this.dataset.user;
                var user = login(username, '123456');
                if (user) {
                    var params = new URLSearchParams(location.search);
                    var redirect = params.get('redirect');
                    if (redirect) {
                        window.location.href = decodeURIComponent(redirect);
                    } else if (isAdmin(user.role)) {
                        window.location.href = 'admin/index.html';
                    } else {
                        window.location.href = '../index.html';
                    }
                }
            });
        });
    </script>
</body>
</html>
